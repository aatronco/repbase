<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d16"><title>Repbase · Jacked & Tan 2.0</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/themes.css"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"></head>
<body><header><a href="#/home" class="brand">REPBASE</a><span class="edition">JACKED & TAN 2.0</span></header><section id="ambience" class="ambience" aria-label="Ambiente visual y musical"><label>Tema visual y musical<select id="theme-select" aria-label="Tema visual y musical"></select></label><div class="music-buttons"><button id="music-toggle" class="secondary" type="button" aria-pressed="false">▶ Reproducir música</button><button id="music-mute" type="button" class="secondary" aria-pressed="false">Silenciar</button></div><div class="music-settings"><label class="volume-control">Volumen <input id="music-volume" type="range" min="0" max="40" value="18" aria-label="Volumen de la música"><output id="volume-value">18%</output></label><div class="music-status-row"><span class="equalizer" aria-hidden="true"><i></i><i></i><i></i></span><p id="music-status" role="status">Música detenida</p></div></div></section><main id="app"></main><nav aria-label="Navegación principal"><a href="#/home">Programa</a><a href="#/setup">Mis marcas</a><a href="#/history">Historial</a><a href="#/guide">Guía</a></nav><p id="status" role="status" aria-live="polite"></p>
<dialog id="picker"><form method="dialog"><p class="eyebrow">AJUSTAR VALOR</p><h2 id="picker-title">Peso</h2><div id="wheel" role="listbox" tabindex="0" aria-label="Selector de peso"></div><label>Entrada directa <input id="picker-number" inputmode="decimal" type="number" min="0" max="2000" step="any"></label><p class="muted">Desliza o usa ↑ ↓. El cambio se guarda al confirmar.</p><div class="actions"><button type="button" value="cancel" formnovalidate class="secondary">Cancelar</button><button value="confirm" id="picker-confirm">Confirmar</button></div></form></dialog>
<script type="module" src="js/app.js"></script></body></html>
